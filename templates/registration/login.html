<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  {% include "partials/head.html" %}
  <title>Entrar - FinançasPro</title>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex items-center justify-center p-4">
  <form method="post" class="w-full max-w-sm bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-5">
    {% csrf_token %}
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-brand-500/20">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg tracking-tight leading-none">FinançasPro</h1>
        <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">Gestão Pessoal</span>
      </div>
    </div>

    {% if form.errors %}
      <div class="px-4 py-3 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 dark:bg-rose-950/40 dark:text-rose-400">Usuário ou senha incorretos.</div>
    {% endif %}

    <div>
      <label for="id_username" class="block text-xs font-semibold text-slate-500 uppercase mb-1">Usuário</label>
      <input type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" autofocus required autocomplete="username"
             class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    </div>
    <div>
      <label for="id_password" class="block text-xs font-semibold text-slate-500 uppercase mb-1">Senha</label>
      <input type="password" name="password" id="id_password" required autocomplete="current-password"
             class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition-colors shadow-md shadow-brand-500/20">Entrar</button>
  </form>
</body>
</html>
